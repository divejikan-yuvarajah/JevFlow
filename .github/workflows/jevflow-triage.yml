name: JevFlow issue triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing issue number to re-run JevFlow on'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  # Keep dispatch input as data here; the runner validates it as a positive safe integer.
  group: jevflow-${{ github.repository_id }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out JevFlow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Triage issue
        run: npm run triage:github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
